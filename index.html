<style>
:root{
  --bg:#FFFFFF; --s1:#FFFFFF; --s2:#F5F6F8; --field:#F3F4F6;
  --ink:#111827; --muted:#6B7280; --line:rgba(17,24,39,.12);
  --gold:#111827; --gold2:#111827; --gold-ink:#FFFFFF;
  --good:#16A34A; --danger:#DC2626; --focus:#2563EB;
  --l1:58%; --l2:70%; --l3:30%; --ink-art:#1A0307;
  --shadow:0 2px 0.25rem rgba(17,24,39,.06),0 1.125rem 2.5rem rgba(17,24,39,.12);
  --serif:'Cormorant Garamond','Noto Sans Devanagari',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gl:max(1.125rem,env(safe-area-inset-left,0px)); --gr:max(1.125rem,env(safe-area-inset-right,0px));
  color-scheme:light;
}
html,body{margin:0}
html{font-size:clamp(13px,.55vw + 10.5px,20px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font:400 0.9375rem/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1;text-wrap:balance;font-weight:600}
p{margin:0} img{max-width:100%} [hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:0.1875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:77.5rem;margin:0 auto;padding:0 var(--gl) 0 var(--gr)}

.lg{position:relative;flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:transparent;border:1px dashed rgba(17,24,39,.45);font:700 1.625rem/1 var(--serif);color:var(--gold2);pointer-events:none}
.lg img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:transparent;padding:0}
.lg.has{border:0;background:none;font-size:0;color:transparent;overflow:visible}

.splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;padding:1.5rem;overflow:hidden;cursor:pointer;animation:splashOut .7s cubic-bezier(.65,0,.35,1) 3.3s forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.08);filter:blur(.4rem);visibility:hidden}}
.splash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(201,149,78,.16),transparent 55%);animation:warm 1.6s ease-out both}
@keyframes warm{from{opacity:0}}
.splash-c{position:relative;display:grid;gap:1.6rem;justify-items:center;text-align:center;max-width:100%}
.sp-logo{position:relative;width:clamp(9.5rem,46vw,15rem);aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;animation:logoIn 1.3s cubic-bezier(.16,1,.3,1) .15s both}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-14deg);clip-path:circle(0% at 50% 50%)}60%{clip-path:circle(52% at 50% 50%)}to{opacity:1;transform:none;clip-path:circle(52% at 50% 50%)}}
.sp-logo img{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 .5rem 2rem rgba(120,80,30,.28),0 0 0 1px rgba(201,149,78,.35);object-fit:cover}
.sp-logo::before,.sp-logo::after{content:"";position:absolute;inset:-.5rem;border-radius:50%;border:2px solid #C9954E;opacity:0;animation:ping 1.8s ease-out 1.1s both}
.sp-logo::after{animation-delay:1.55s}
@keyframes ping{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.sp-shine{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.sp-shine::after{content:"";position:absolute;top:-10%;bottom:-10%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-14deg);animation:shine 1.1s ease-in-out 1.35s both}
@keyframes shine{to{left:130%}}
.wm{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,8.5vw,3.6rem);letter-spacing:.01em;line-height:1.05;margin:0;color:#111827;max-width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .32em}
.wm .w{display:inline-block;overflow:hidden;padding-bottom:.12em}
.wm .w span{display:inline-block;background:linear-gradient(110deg,#8A5A22,#C9954E 45%,#8A5A22);-webkit-background-clip:text;background-clip:text;color:transparent;animation:wordUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.5s + var(--i)*.18s)}
@keyframes wordUp{from{transform:translateY(110%)}}
.rule{height:1px;width:0;background:linear-gradient(90deg,transparent,#C9954E,transparent);animation:rule 1s cubic-bezier(.2,.8,.2,1) 2.1s forwards}
@keyframes rule{to{width:min(20rem,70vw)}}
.tag{font-size:clamp(0.875rem,3.6vw,1.125rem);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:fadeUp .8s ease 2.3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(0.625rem)}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.78);backdrop-filter:blur(1.125rem) saturate(1.4);-webkit-backdrop-filter:blur(1.125rem) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand search acts";align-items:center;gap:0.625rem 1.75rem;max-width:77.5rem;margin:0 auto;padding:0.75rem var(--gr) 0.75rem var(--gl)}
.brand{grid-area:brand;min-width:0;display:flex;align-items:center;gap:0.75rem;background:none;border:0;padding:0;color:var(--ink);text-align:left}
.bn{font:600 1.5625rem/1 var(--serif);letter-spacing:.01em;color:var(--gold2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.search{grid-area:search;display:flex;min-width:0;max-width:37.5rem;width:100%;justify-self:center;background:var(--field);border:1px solid var(--line);border-radius:62.4375rem;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 0.25rem rgba(17,24,39,.15)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:0.75rem 1.125rem;outline:none}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:none;color:var(--gold);width:3.125rem;display:grid;place-items:center}
.acts{grid-area:acts;display:flex;align-items:center;gap:0.25rem}
.rel{position:relative}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:0.5rem;background:none;border:0;color:var(--ink);padding:0.5625rem 0.75rem;border-radius:62.4375rem;font-weight:600;font-size:0.875rem;transition:background .2s}
.hbtn:hover{background:rgba(17,24,39,.1)}
.ic{position:relative;display:inline-grid}
.badge{position:absolute;top:-0.5625rem;right:-0.6875rem;min-width:1.25rem;height:1.25rem;padding:0 0.3125rem;border-radius:0.625rem;background:var(--gold);color:var(--gold-ink);font-size:0.75rem;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.menu{position:absolute;right:0;top:calc(100% + 0.625rem);width:14.375rem;background:var(--s1);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);padding:0.875rem;display:grid;gap:0.625rem;z-index:40}
.menu p{color:var(--muted);font-size:0.8125rem}.menu b{color:var(--ink);display:block;font-size:0.9375rem}
@media(max-width:700px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand acts" "search search";gap:0.625rem}
  .bn{font-size:1.15rem;white-space:normal;line-height:1.05}.lg{width:2.375rem;height:2.375rem}.hbtn .lbl{display:none}.hbtn{padding:0.5625rem}.search{max-width:none}
}

@media(max-width:380px){.bn{font-size:1rem}.hero h1{font-size:2.4rem}}
@media(min-width:1700px){.wrap,.hero,.hb,.trust-row,.top-in,.foot-in,.copy}
.hero{max-width:77.5rem;margin:0 auto;padding:3.5rem var(--gr) 2.5rem var(--gl);display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(2.75rem,7vw,5.5rem);font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.hero h1 em{display:block;font-style:italic;font-weight:500;color:var(--gold2)}
.hero p.lead{margin-top:1.25rem;max-width:46ch;color:var(--muted);font-size:1.0625rem}
.hero .cta{margin-top:1.875rem;display:flex;gap:0.875rem;flex-wrap:wrap;align-items:center}
.hero .stats{margin-top:2.375rem;display:flex;gap:2.125rem;flex-wrap:wrap;color:var(--muted);font-size:0.8125rem}
.hero .stats b{display:block;font:600 1.875rem/1 var(--serif);color:var(--ink);margin-bottom:0.25rem}
.hb{max-width:77.5rem;margin:1.1rem auto 1rem;padding:0 var(--gr) 0 var(--gl)}
.best{position:relative;height:clamp(13.5rem,27vw,23rem);border-radius:1.5rem;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--s1)}
.btrk{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.btrk::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;height:100%;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;margin:0;padding:0;border:0;overflow:hidden;color:var(--ink);text-align:left;cursor:pointer;scroll-snap-align:center;scroll-snap-stop:always;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(60% 130% at 80% 50%,hsl(var(--h) 70% 60% / .22),transparent 70%),linear-gradient(110deg,#FFFFFF,#F5F6F8)}
.bt{position:relative;z-index:1;display:grid;gap:0.5rem;justify-items:start;align-content:center;padding:0 0.5rem 0 clamp(1.1rem,4.5vw,4rem)}
.bl{font-size:0.6875rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.bh{font:600 clamp(1.3rem,3vw,2.4rem)/1.1 var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.bp{display:flex;align-items:baseline;flex-wrap:wrap;gap:0.25rem 0.55rem}
.bp b{font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:700}
.bp s{color:var(--muted);font-size:clamp(0.75rem,1.3vw,0.95rem)}
.bp em{font-style:normal;background:rgba(17,24,39,.16);color:var(--gold2);font-weight:700;font-size:clamp(0.7rem,1.2vw,0.85rem);padding:0.1rem 0.5rem;border-radius:62.4375rem}
.bcta{margin-top:0.2rem;padding:0.5rem 1.15rem;border-radius:62.4375rem;background:#111827;color:var(--gold-ink);font-weight:700;font-size:clamp(0.78rem,1.4vw,0.95rem);box-shadow:0 0.375rem 1.25rem rgba(17,24,39,.22)}
.bi{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:0 clamp(.6rem,2.5vw,1.6rem) 0 0}
.bi .ph{display:grid;height:92%;aspect-ratio:3/4;max-width:94%;border-radius:1.3rem;overflow:hidden;border:1px solid rgba(17,24,39,.45);box-shadow:0 1.1rem 2.4rem rgba(17,24,39,.18);background:var(--s2)}
.bi .ph svg,.bi .ph img{-webkit-user-drag:none;user-select:none}
.bdots{position:absolute;left:50%;right:0;bottom:0.5rem;z-index:2;display:flex;justify-content:center;align-items:center;gap:0.4rem}
.bdots button{width:0.5rem;height:0.5rem;padding:0;border:0;border-radius:62.4375rem;background:rgba(17,24,39,.4);transition:width .25s,background .25s}
.bdots button[aria-current="true"]{width:1.4rem;background:var(--gold)}
.bcnt{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--gold2);font-size:0.72rem;font-weight:700;padding:0.1rem 0.6rem;border-radius:62.4375rem;font-variant-numeric:tabular-nums}

/* ===== Premium Bestseller banner (fashion / portrait photo) ===== */
.best{height:clamp(14.5rem,52vw,21rem);border-radius:1.5rem;border:1px solid rgba(201,162,75,.55);
  box-shadow:0 1.25rem 2.75rem rgba(11,15,26,.28),inset 0 0 0 1px rgba(255,255,255,.04);background:#0B0F1A}
.bs{display:block;background:
  radial-gradient(70% 90% at 12% 0%,rgba(201,162,75,.20),transparent 60%),
  linear-gradient(115deg,#0B0F1A 0%,#161C2C 55%,#222839 100%);color:#fff}
.bs .bt{position:absolute;left:0;top:0;bottom:0;width:58%;z-index:3;display:grid;gap:0.45rem;justify-items:start;align-content:center;
  padding:0 0.25rem 1.2rem clamp(1.1rem,4.5vw,4rem)}
.bs .bl{display:flex;align-items:center;gap:0.55rem;color:#D9B867;font-size:0.66rem;letter-spacing:.28em}
.bs .bl::before{content:"";width:1.6rem;height:1px;background:linear-gradient(90deg,transparent,#D9B867)}
.bs .bh{color:#fff;font:600 clamp(1.45rem,5.4vw,2.7rem)/1.08 var(--serif);letter-spacing:.005em;-webkit-line-clamp:2;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.bs .bp{gap:0.15rem 0.6rem;align-items:baseline}
.bs .bp b{color:#fff;font-size:clamp(1.15rem,4.4vw,1.8rem)}
.bs .bp s{color:rgba(255,255,255,.55)}
.bs .bp em{background:linear-gradient(135deg,#E8CB7A,#B88A2E);color:#1A1405;font-weight:800;letter-spacing:.02em}
.bs .bcta{margin-top:0.35rem;display:inline-flex;align-items:center;gap:0.45rem;padding:0.55rem 1.2rem;border-radius:62.4375rem;

  box-shadow:0 0.5rem 1.3rem rgba(201,162,75,.38)}
.bs .bcta::after{content:"\2192";font-weight:700;transition:transform .2s}
.bs:hover .bcta::after{transform:translateX(4px)}
.bs .bi{position:absolute;right:0;top:0;bottom:0;width:60%;height:auto;padding:0;display:block;z-index:1;

.bs .bi .ph{position:absolute;inset:0;display:block;height:100%;width:100%;max-width:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;background:transparent}
.bs .bi .ph .shot{object-fit:cover;object-position:50% 18%}
.bs .bi .ph svg{width:100%;height:100%}
.bs::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,15,26,.0) 60%,rgba(11,15,26,.55) 100%)}
.best .bdots{left:clamp(1.1rem,4.5vw,4rem);right:auto;justify-content:flex-start;bottom:0.9rem;z-index:4}

@media(min-width:821px){.best{height:clamp(18rem,26vw,23rem)}.bs .bt{width:48%}.bs .bi{width:52%}}
@keyframes float{50%{transform:translateY(-0.75rem)}}
.tagc{font:inherit;position:absolute;right:0;bottom:10%;z-index:2;display:grid;gap:2px;text-align:left;padding:0.75rem 1.125rem;border-radius:1rem;background:rgba(59,10,21,.85);backdrop-filter:blur(0.625rem);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.tagc small{color:var(--muted);font-size:0.75rem}.tagc b{font:600 1.375rem/1.1 var(--serif);color:var(--gold2)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:2.125rem;gap:0.625rem}}

/* ===== Slim trust strip (now sits above the banner) ===== */
.trust-row{margin:0.7rem auto 0;gap:0.5rem}

   ============================================================ */

.page .cbar .btn{flex:0 0 auto;width:auto;min-width:0;padding:.7rem 1.2rem;font-size:.7rem}

/* ---------- CART: full-screen page that slides up ---------- */
.drawer{left:0;right:0;width:100%;border:0;transform:translateY(100%);box-shadow:none;transition:transform .38s cubic-bezier(.2,.8,.2,1);
  --gx:max(1rem,calc((100vw - 46rem)/2))}
.drawer .dh{display:grid;grid-template-columns:2.4rem 1fr 2.4rem;align-items:center;gap:.5rem;padding:.6rem var(--gx);background:#fff}
.drawer .dh h2{text-align:center;font:800 .8rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.drawer .dh h2 span{color:var(--muted);letter-spacing:.04em;font-size:.8rem}
.drawer .x{width:2.4rem;height:2.4rem;display:grid;place-items:center;padding:0;background:var(--field);border:1px solid var(--line)}
.drawer .db{padding:1rem var(--gx) .4rem;background:var(--s2)}
.drawer .ci{grid-template-columns:4.8rem 1fr;gap:.9rem;padding:.8rem;margin-bottom:.7rem;border:1px solid var(--line);border-radius:.8rem;background:#fff}
.drawer .ci .ph{border-radius:.55rem}
.drawer .cn{font:600 1.15rem/1.15 var(--serif)}
.drawer .cp b{font:800 1rem/1 var(--sans);font-variant-numeric:lining-nums tabular-nums}
.drawer .step{border-radius:.6rem;background:var(--field)}
.drawer .lnk.red{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;font-weight:800}
.drawer .df{background:#fff;gap:.5rem;padding:.9rem var(--gx) max(1rem,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.drawer .save{display:inline-block;justify-self:start;margin:0;padding:.2rem .65rem;border-radius:62.4375rem;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.35);font-weight:700}
.drawer .cbar2{display:flex;justify-content:space-between;align-items:center;gap:.8rem;border-top:1px dashed var(--line);padding-top:.7rem;margin-top:.1rem}
.drawer .cbar2 .btn{flex:0 0 auto;width:auto;padding:.75rem 1.5rem;font-size:.72rem}
.drawer .dsec{margin:0;text-align:center;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.drawer .empty{padding-top:4rem}

/* ---------- amounts: clean lining numerals, no old-style digits ---------- */
.cbt b,.page .prow.t span:last-child{font-family:var(--sans);font-weight:800;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.page .cbt b{font-size:1.35rem}
.page .prow.t span:last-child{font-size:1.15rem}
.page .amt{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.05rem 1.2rem;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:.8rem}
.page .amt small{display:block;margin-bottom:.45rem;font:700 .64rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.page .amt b{display:block;font:800 1.9rem/1 var(--sans);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.page .amt .sv{flex:none;padding:.35rem .75rem;font-size:.72rem;font-weight:800}

/* ---------- OPENING STYLE of pages (soft rise + fade) ---------- */
.page.enter{animation:pgOpen .34s cubic-bezier(.2,.8,.2,1)}
@keyframes pgOpen{from{opacity:0;transform:translateY(1.5rem) scale(.985)}}
@keyframes acIn{from{opacity:0;transform:translateY(.9rem)}}

/* ---------- MY ACCOUNT: profile card + tiles ---------- */
.acct .ac-card{position:relative;overflow:hidden;margin-bottom:1rem;padding:1.2rem 1.2rem 1rem;border-radius:1.25rem;background:#111827;color:#fff}
.ac-card::after{content:"";position:absolute;right:-3rem;top:-3.5rem;width:10rem;height:10rem;border-radius:50%;background:rgba(255,255,255,.06)}
.ac-top{position:relative;z-index:1;display:flex;align-items:center;gap:.9rem}
.ac-card .av{width:3.4rem;height:3.4rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:1.5rem}
.ac-id{min-width:0}
.ac-id h1{font:600 1.5rem/1.1 var(--serif);color:#fff;overflow-wrap:anywhere}
.ac-id p{margin:.25rem 0 0;color:rgba(255,255,255,.65);font-size:.85rem}
.ac-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);margin-top:1.1rem;padding-top:.9rem;border-top:1px solid rgba(255,255,255,.16)}
.ac-stats div{text-align:center}.ac-stats div+div{border-left:1px solid rgba(255,255,255,.16)}
.ac-stats b{display:block;margin-bottom:.3rem;font:800 1.3rem/1 var(--sans);font-variant-numeric:lining-nums}
.ac-stats span{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65);font-weight:700}
.ac-tiles{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.ac-tile{position:relative;display:grid;align-content:space-between;gap:1rem;min-height:7.6rem;padding:1rem;text-align:left;border:1px solid var(--line);border-radius:1rem;background:#fff;color:var(--ink);transition:transform .15s,border-color .2s}
.ac-tile:hover{border-color:rgba(17,24,39,.45)}.ac-tile:active{transform:scale(.97)}
.ac-ic{width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:.85rem;background:var(--field);color:var(--ink)}
.ac-go{position:absolute;top:.8rem;right:1rem;font-size:1.5rem;line-height:1;color:var(--muted)}
.ac-t{display:grid;gap:.15rem}
.ac-l{font-weight:800;font-size:.95rem}
.ac-n{color:var(--muted);font-size:.82rem;font-weight:600}
.ac-out{margin-top:1rem;width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem;border:1px solid rgba(220,38,38,.35);border-radius:.8rem;background:#fff;color:var(--danger);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.page.enter .ac-card,.page.enter .ac-tile,.page.enter .ac-out{animation:acIn .45s cubic-bezier(.2,.8,.2,1) both}
.page.enter .ac-tile:nth-child(1){animation-delay:.07s}.page.enter .ac-tile:nth-child(2){animation-delay:.12s}
.page.enter .ac-tile:nth-child(3){animation-delay:.17s}.page.enter .ac-tile:nth-child(4){animation-delay:.22s}
.page.enter .ac-out{animation-delay:.28s}
@media(prefers-reduced-motion:reduce){.page.enter,.page.enter *{animation:none!important}.drawer{transition:none}}

/* ============ FRAMED PRODUCT CARD (photo + cream caption plate, gold border) ============ */
.grid{gap:1.05rem .95rem}
.card{position:relative;border:3px solid transparent;border-radius:.5rem;overflow:hidden;
  background:linear-gradient(#F8F2DE,#F8F2DE) padding-box,
    linear-gradient(135deg,#FFF3B8 0%,#E8C355 16%,#B8860B 34%,#F7DC84 50%,#A87608 68%,#E9C560 84%,#8F6410 100%) border-box;
  box-shadow:0 .55rem .9rem -.35rem rgba(45,28,6,.5),0 0 .7rem rgba(214,172,60,.38);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-.25rem);box-shadow:0 .9rem 1.3rem -.4rem rgba(45,28,6,.55),0 0 1rem rgba(224,182,70,.55)}
.card .ph{aspect-ratio:3/4;border-radius:0}
.card .cb{position:relative;display:block;padding:.85rem .6rem .75rem;border-top:0;
  background:linear-gradient(180deg,#FCF8E8,#F2E9C8);text-align:center}
.card .cb::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#9C6F0C,#FFF1B0 22%,#D4A62A 50%,#FFF1B0 78%,#9C6F0C)}
.card .cb::before{content:"";position:absolute;left:50%;top:-.44rem;z-index:1;width:.66rem;height:.66rem;transform:translateX(-50%) rotate(45deg);
  background:linear-gradient(135deg,#FFF0A8,#D4A62A 50%,#8A6414);border:1px solid #6F500E;box-shadow:0 0 .3rem rgba(214,172,60,.6)}
.card .pr{justify-content:center;align-items:baseline;gap:.55rem}
.card .pr b{font:800 1.12rem/1 var(--sans);color:#1B1710;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.card .pr s{color:#7C725A;font-size:.8rem;font-variant-numeric:lining-nums}
.card .off{top:.6rem;left:.6rem;background:#fff;border:1px solid rgba(17,24,39,.18);color:#111827;font-size:.7rem;font-weight:800;padding:.2rem .55rem;border-radius:.35rem;backdrop-filter:none}
.card .ph .hrt{top:.55rem;right:.55rem;width:2.1rem;height:2.1rem}
.card .rtg{position:absolute;left:.6rem;bottom:.6rem;z-index:2;display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .55rem;border-radius:.35rem;
  background:rgba(17,24,39,.82);color:#fff;font-size:.72rem;font-weight:700;font-variant-numeric:lining-nums}
.card .rtg b{font-weight:800}
.card .ph:has(.oos) .rtg{bottom:2.7rem}
.card .rtg i{font-style:normal;color:rgba(255,255,255,.68);font-weight:600;margin-left:.15rem;padding-left:.35rem;border-left:1px solid rgba(255,255,255,.3)}

/* ============ Product detail photo: same real-gold frame ============ */
.dt>.ph.gal{border:3px solid transparent;border-radius:.6rem;overflow:hidden;
  background:linear-gradient(#FFFFFF,#F7F3E6) padding-box,
    linear-gradient(135deg,#FFF3B8 0%,#E8C355 16%,#B8860B 34%,#F7DC84 50%,#A87608 68%,#E9C560 84%,#8F6410 100%) border-box;
  box-shadow:0 .7rem 1.1rem -.4rem rgba(45,28,6,.5),0 0 .8rem rgba(214,172,60,.4)}
@media(max-width:820px){.dt>.ph.gal{border-radius:.5rem}}
.dt>.ph.gal .cnt{border-radius:.35rem;background:rgba(17,24,39,.8);color:#fff;border-color:transparent}
.dt>.ph.gal .dd button[aria-current="true"]{background:#B8860B}

/* ---- rating on product detail: badge on photo + clear pill under title ---- */
.gal .rtg{position:absolute;left:.7rem;bottom:.7rem;z-index:3;display:inline-flex;align-items:center;gap:.28rem;padding:.28rem .65rem;border-radius:.4rem;
  background:rgba(17,24,39,.85);color:#fff;font-size:.8rem;font-weight:700;font-variant-numeric:lining-nums}
.gal .rtg b{font-weight:800}
.gal .rtg i{font-style:normal;margin-left:.2rem;padding-left:.4rem;border-left:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.75);font-weight:600}
.rt.big{color:var(--ink);font-size:.9rem;font-weight:600}
.rt.big .pill{background:#111827;color:#fff;font-size:.82rem;padding:.2rem .7rem;border-radius:.4rem}

/* ===== SIZE SELECTOR ===== */
.szb{display:grid;gap:.6rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--s1)}
.szh{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.szh b{font-size:.95rem}.szh em{font-style:normal;color:var(--danger);font-size:.8rem;font-weight:700}
.szs{display:flex;flex-wrap:wrap;gap:.55rem}
.sz{position:relative;overflow:hidden;min-width:3.3rem;padding:.55rem .85rem;border:1.5px solid rgba(17,24,39,.3);border-radius:.6rem;background:#fff;color:var(--ink);font-weight:800;display:grid;justify-items:center;gap:.1rem;transition:background .15s,color .15s,border-color .15s}
.sz:hover:not(:disabled){border-color:var(--ink)}
.sz small{font-size:.58rem;font-weight:700;color:var(--danger);line-height:1.1;text-align:center}
.sz.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sz.out,.sz.out:disabled{background:#F3F4F6;color:#9CA3AF;border:1.5px dashed #D1D5DB;cursor:not-allowed}
.sz.out::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(220,38,38,.75) 50%,transparent calc(50% + 1px))}
.szb.warn{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.szn{margin:0;color:var(--danger);font-size:.82rem;font-weight:700}
</style>
</head>
<body>
<div id="splash" class="splash" role="status" aria-label="Loading">
  <div class="splash-c">
    <div class="sp-logo"><img alt=""><span class="sp-shine"></span></div>
    <h1 class="wm" id="splashWm"></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tag" id="splashTag"></p>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <div class="brand" id="brandBtn" style="cursor:default"></div>
    <form class="search" id="searchForm" role="search">
      <label class="sr" for="q">Search products</label>
      <input id="q" type="search" placeholder="Search kurti, shirts, jeans…" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </form>
    <div class="acts">
      <div class="rel">
        <button class="hbtn login" id="acctBtn" data-act="account" aria-label="Account">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="lbl" id="acctLbl">Login</span>
          <svg class="chv" id="acctCh" hidden width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <p>Signed in as<b id="menuPhone"></b></p>
          <button class="btn alt" data-act="logout">Log out</button>
        </div>
      </div>
      <button class="hbtn" data-act="cart-open" id="cartBtn" aria-label="Open cart">
        <span class="ic">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <b class="badge" id="badge" hidden>0</b>
        </span>
        <span class="lbl">Cart</span>
      </button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="foot">
  <div class="foot-in">
    <div><div class="brand" style="cursor:default" id="footBrand"></div><p id="footTag"></p></div>
    <nav aria-label="Footer"><span>Secure checkout</span><span>Genuine products</span></nav>
  </div>
  <div class="copy">© Your Store Name. All rights reserved.</div>
</footer>

<div id="page" class="page" hidden></div>
<div id="scrim" class="scrim" data-act="cart-close"></div>
<aside id="cart" class="drawer" aria-label="Shopping cart" inert>
  <div class="dh">
    <button class="x" data-act="cart-close" aria-label="Close cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
    <h2>Your cart <span id="cartCount"></span></h2>
    <span aria-hidden="true"></span>
  </div>
  <div class="db" id="cartBody"></div>
  <div class="df" id="cartFoot"></div>
</aside>

<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="fast.js?v=4"></script><script src="script.js?v=7"></script>
</body>
</html>
